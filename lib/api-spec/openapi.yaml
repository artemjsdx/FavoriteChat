openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FavoriteChat API — multi-agent Telegram bot management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: AI agent management
  - name: channels
    description: Telegram channel/group management
  - name: dashboard
    description: Dashboard stats and activity
  - name: settings
    description: Global settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AGENTS ────────────────────────────────────────────────────────────────

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents for current user
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/validate-token:
    post:
      operationId: validateBotToken
      tags: [agents]
      summary: Validate a Telegram bot token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenValidation"
      responses:
        "200":
          description: Token validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenValidationResult"

  /agents/validate-api-key:
    post:
      operationId: validateApiKey
      tags: [agents]
      summary: Validate an AI API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyValidation"
      responses:
        "200":
          description: API key validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyValidationResult"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    put:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # ── CHANNELS ──────────────────────────────────────────────────────────────

  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List all channels
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Add a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/{id}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get channel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    put:
      operationId: updateChannel
      tags: [channels]
      summary: Update channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /channels/{id}/agents:
    get:
      operationId: listChannelAgents
      tags: [channels]
      summary: List agents bound to a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: bindChannelAgent
      tags: [channels]
      summary: Bind an agent to a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelAgentBinding"
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /channels/{id}/agents/{agentId}:
    delete:
      operationId: unbindChannelAgent
      tags: [channels]
      summary: Remove agent from channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unbound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # ── DASHBOARD ─────────────────────────────────────────────────────────────

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent agent activity feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: agentId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: channelId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /models:
    get:
      operationId: getModels
      tags: [dashboard]
      summary: Get available AI models (OpenRouter free + paid)
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsList"

  # ── SETTINGS ──────────────────────────────────────────────────────────────

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get global settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update global settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Agent ─────────────────────────────────────────────────────────────

    Agent:
      type: object
      required: [id, name, botUsername, apiType, model, active, createdAt]
      properties:
        id:               { type: integer }
        userId:           { type: ["integer", "null"] }
        name:             { type: string }
        botUsername:      { type: string }
        botId:            { type: ["integer", "null"] }
        apiType:          { type: string }
        model:            { type: string }
        apiUrl:           { type: ["string", "null"] }
        userPrompt:       { type: ["string", "null"] }
        responseChance:   { type: integer }
        minDelaySec:      { type: integer }
        maxDelaySec:      { type: integer }
        active:           { type: boolean }
        webhookRegistered: { type: boolean }
        createdAt:        { type: string }

    AgentInput:
      type: object
      required: [botToken, apiType, apiKey, model]
      properties:
        userId:           { type: ["integer", "null"] }
        name:             { type: ["string", "null"] }
        botToken:         { type: string }
        apiType:          { type: string }
        apiKey:           { type: string }
        apiUrl:           { type: ["string", "null"] }
        model:            { type: string }
        userPrompt:       { type: ["string", "null"] }
        responseChance:   { type: ["integer", "null"] }
        minDelaySec:      { type: ["integer", "null"] }
        maxDelaySec:      { type: ["integer", "null"] }

    AgentUpdate:
      type: object
      properties:
        name:             { type: ["string", "null"] }
        apiType:          { type: ["string", "null"] }
        apiKey:           { type: ["string", "null"] }
        apiUrl:           { type: ["string", "null"] }
        model:            { type: ["string", "null"] }
        userPrompt:       { type: ["string", "null"] }
        responseChance:   { type: ["integer", "null"] }
        minDelaySec:      { type: ["integer", "null"] }
        maxDelaySec:      { type: ["integer", "null"] }
        active:           { type: ["boolean", "null"] }

    TokenValidation:
      type: object
      required: [token]
      properties:
        token: { type: string }

    TokenValidationResult:
      type: object
      required: [valid]
      properties:
        valid:      { type: boolean }
        botId:      { type: ["integer", "null"] }
        username:   { type: ["string", "null"] }
        firstName:  { type: ["string", "null"] }
        error:      { type: ["string", "null"] }

    ApiKeyValidation:
      type: object
      required: [apiType, apiKey]
      properties:
        apiType:  { type: string }
        apiKey:   { type: string }
        apiUrl:   { type: ["string", "null"] }

    ApiKeyValidationResult:
      type: object
      required: [valid]
      properties:
        valid:          { type: boolean }
        defaultModel:   { type: ["string", "null"] }
        contextKb:      { type: ["number", "null"] }
        error:          { type: ["string", "null"] }

    # ── Channel ───────────────────────────────────────────────────────────

    Channel:
      type: object
      required: [id, title, type, contextMessages, active, createdAt]
      properties:
        id:                 { type: integer }
        userId:             { type: ["integer", "null"] }
        telegramChatId:     { type: string }
        linkedGroupId:      { type: ["string", "null"] }
        title:              { type: string }
        type:               { type: string }
        contextMessages:    { type: integer }
        active:             { type: boolean }
        agentCount:         { type: ["integer", "null"] }
        createdAt:          { type: string }

    ChannelInput:
      type: object
      required: [telegramChatId, title, type]
      properties:
        userId:             { type: ["integer", "null"] }
        telegramChatId:     { type: string }
        linkedGroupId:      { type: ["string", "null"] }
        title:              { type: string }
        type:               { type: string }
        contextMessages:    { type: ["integer", "null"] }

    ChannelUpdate:
      type: object
      properties:
        title:              { type: ["string", "null"] }
        linkedGroupId:      { type: ["string", "null"] }
        contextMessages:    { type: ["integer", "null"] }
        active:             { type: ["boolean", "null"] }

    ChannelAgentBinding:
      type: object
      required: [agentId]
      properties:
        agentId:  { type: integer }
        priority: { type: ["integer", "null"] }

    # ── Dashboard ─────────────────────────────────────────────────────────

    DashboardStats:
      type: object
      required: [totalAgents, totalChannels, messagesToday, activeDiscussions, activeAgents]
      properties:
        totalAgents:        { type: integer }
        totalChannels:      { type: integer }
        messagesToday:      { type: integer }
        activeDiscussions:  { type: integer }
        activeAgents:       { type: integer }

    ActivityItem:
      type: object
      required: [id, agentName, agentUsername, channelTitle, text, createdAt]
      properties:
        id:             { type: integer }
        agentName:      { type: string }
        agentUsername:  { type: string }
        channelTitle:   { type: string }
        channelId:      { type: ["integer", "null"] }
        text:           { type: string }
        isReply:        { type: boolean }
        createdAt:      { type: string }

    ModelInfo:
      type: object
      required: [id, name, free, contextLength]
      properties:
        id:             { type: string }
        name:           { type: string }
        free:           { type: boolean }
        contextLength:  { type: integer }
        pricing:        { type: ["string", "null"] }

    ModelsList:
      type: object
      required: [free, paid]
      properties:
        free:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
        paid:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
        favoriteModels:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"

    # ── Settings ──────────────────────────────────────────────────────────

    Settings:
      type: object
      required: [id, defaultContextMessages, updatedAt]
      properties:
        id:                     { type: integer }
        favoriteApiUrl:         { type: ["string", "null"] }
        defaultContextMessages: { type: integer }
        updatedAt:              { type: string }

    SettingsUpdate:
      type: object
      properties:
        favoriteApiUrl:         { type: ["string", "null"] }
        defaultContextMessages: { type: ["integer", "null"] }

    DeleteResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: ["string", "null"] }
